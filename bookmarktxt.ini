[main]
# The keyword prefix that triggers bookmark search.
# * Type the keyword followed by a space, then your search terms.
# * All terms must match (AND logic). The full raw line is searched,
#   so tags are naturally included.
# * Type: String
# * Default: bkm
#keyword = bkm

# The prefix that marks a line as a comment in bookmark files.
# * Lines starting with this string are skipped during parsing.
# * Type: String
# * Default: #
#comment_prefix = #

# Maximum display length of bookmark descriptions in the results list.
# * Accepts a plain integer (character count) or a percentage string (e.g.
#   "20%") calculated from screen width.
# * Default: 20%
#max_desc_len = 20%

# Individual bookmark files to load.
# * Semicolon-separated paths. Supports ${env:VAR}, ${knownfolder:GUID} and ~.
# * Default: empty
#files =
#    ~/.bookmarks/example.bkm

# Directories to scan for bookmark files (recursive).
# * Semicolon-separated. Supports ${env:VAR}, ${knownfolder:GUID} and ~.
# * Default: empty
directories =
    ${env:USERPROFILE}/.bookmarks

# File name globs to include when scanning directories.
# * Semicolon-separated, matched via fnmatch.
# * Default: *.txt;*.bkm
#include = *.txt;*.bkm

# File and directory name patterns to exclude.
# * Semicolon-separated. A pattern ending with / matches directory names;
#   others match file names via fnmatch.
# * Default: empty
#exclude = *_arch;*.bak

# Default command to open bookmarks when no [scheme/*] section matches.
# * If empty, the system default browser is used for http/https URLs,
#   and the system default application for other URIs like file://.
# * Supports arguments (e.g. "brave -w" opens in a new window).
# * The URL is appended as the last argument.
# * Default: empty
#default_cmd =

# --- Per-scheme open commands ---
#
# Override the application used to open URLs of a specific scheme.
# Supports arguments. The URL is appended as the last argument.
# Uncomment and edit as needed.

#[scheme/http]
#cmd = brave --new-window

#[scheme/https]
#cmd = brave --new-window

#[scheme/mailto]
#cmd = thunderbird

# --- Experimental: Auto-sort ---
[experimental]
# Auto-sort bookmarks when the LaunchBox is activated and a file has changed.
# Handy when you prepend new bookmarks at line 1 and want them sorted into
# place automatically.
# Sort key order: tags (desc) → title (desc) → url (desc).
#
# CAUTION: this rewrites bookmark files in place. Back up your data first.
# Comments are moved to the top and sorted alphabetically (respecting sort_order).
# Blank lines are removed.

#auto_sort = false

# Sort order. One of: alpha_asc, alpha_desc.
# * alpha_asc:  A→Z
# * alpha_desc: Z→A
# * Default: alpha_asc
#sort_order = alpha_asc

# Further restrict which files are auto-sorted (applied after include/exclude).
# * Semicolon-separated globs matched via fnmatch against the file name.
# * Default: empty (all loaded bookmark files)
#sort_include =

# Exclude files from auto-sort (applied after sort_include).
# * Semicolon-separated. Same format as exclude.
# * Default: empty
#sort_exclude =

# --- Bookmark file format ---
# Each non-empty, non-comment line is one bookmark:
#   https://example.com  Title Here - tag
#   https://example.com  Title Here - tag1,tag2
#   https://example.com  Simple bookmark without tags
#   https://example.com
#   file:///C:/doc.pdf   Local document
#
# * The URL/URI must start with a scheme like http://, https://, file://, ftp://
# * The title is the text between the URL and the last " - " separator
# * Tags are comma-separated (no spaces) after the trailing " - "
# * Lines starting with comment_prefix are ignored
# * If a title contains " - ", escape it as " \- " to prevent it from being
#   treated as the tag separator:
#     https://example.com  Github \- Wiki - dev
#     → title: Github - Wiki,  tags: dev
#
# Type keyword followed by space, then search terms:
#   bkm python          Matches "python"
#   bkm ffmpeg guide    Matches both "ffmpeg" AND "guide"