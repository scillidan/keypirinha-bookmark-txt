name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6
      with:
        persist-credentials: false

    - name: Install p7zip
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full

    - name: Build package
      run: make

    - name: Generate SHA256 checksums
      run: sha256sum dist/BookmarkTxt.keypirinha-package > dist/BookmarkTxt.keypirinha-package.sha256

    - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" \
            dist/BookmarkTxt.keypirinha-package \
            dist/BookmarkTxt.keypirinha-package.sha256 \
            --title "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" \
            --generate-notes
